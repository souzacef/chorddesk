[project]
name = "chorddesk"
version = "0.1.0"
description = "Grounded AI customer-support agent for music retail"
readme = "README.md"
authors = [
    { name = "Carlos Eduardo Freire de Souza", email = "souzacef@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.120.0",
    "openai>=3.42.0",
    "pypdf>=6.21.4",
    "uvicorn>=0.38.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
]

[project.scripts]
chorddesk = "chorddesk.cli:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
